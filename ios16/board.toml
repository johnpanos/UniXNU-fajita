# Board description of the OnePlus 6T (fajita, SDM845) with the iOS 16.7.16 userland of the iPhone X, read by the unixnu
# build driver. It is the second boot option next to the iPadOS 17.7.11 board of the parent directory (../board.toml),
# which includes this board's payload entry; see ../NOTES-ios16.md.
#
# This directory is a device directory of its own (unixnu -D ../UniXNU-fajita/ios16): the board name gives it its own build
# tree, feeds (xnu-8796.141.3, feeds.toml), lock and defconfig. drivers, kits, package and scripts are those of the parent.

[board]
name = "fajita-ios16"
soc = "SDM845"
description = "OnePlus 6T, iOS 16.7.16 (iPhone10,6)"
kit = "fajita"

# The unchanged iPhone10,3/iPhone10,6 iOS 16.7.16 restore image. iPhone10,6 (D221AP) is the identity. The pins are the
# sha256 of the members as read on 2026-10-22; their SHA-384 also matches the Digest of BuildManifest.plist.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,6"
version = "16.7.16"
build = "20H392"
device_class = "d221ap"
chip_id = 0x8015
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"087-86698-044.dmg" = "80f426d5b8fca8552f95be427434f1911dbb4c2c6d28aad94f2426ddd0c92483"             # OS
"087-86593-047.dmg" = "9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849"             # Cryptex1,SystemOS
"087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"  # StaticTrustCache
"087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"  # Cryptex1,SystemTrustCache
"DeviceTree.d221ap.im4p" = "889e838319619c10f5f7f6ef25f9ff2a3a652a3c078803038ba678efa1201b79"

# The second root image of userdata: the OS and SystemOS disk images of 20H392 behind a version 2 manifest at 16 GiB,
# after the iPadOS image (8.74 GiB at 0). The kernel finds it with native-ufs-root-base=16384 (drivers/NativeUfs).
[userdata]
first_lba = 0x186f40
last_lba = 0x3ad1ffa
lba_bytes = 4096
base_mib = 16384
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "fajita_ios16_defconfig"
# Archive builders of the kernel step, in order: the iPad list. The storage, verified-root, PMGR and boot progress builders
# run only when the defconfig turns their component on, so fajita_ios16_candidate_defconfig (the first kernel of a new
# kernelcache, without them) builds from the same list and gives the prelinked candidate FAJITA_STORAGE_CANDIDATE names.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  # storage ABI audit and NativeVirtioBlock bindings (needs FAJITA_STORAGE_CANDIDATE, a prelinked 20H392 kernel)
  { run = "build-fajita-storage.py --ipsw-build 20H392", when = "XNU_NATIVE_VIRTIO_BLOCK" },
  { run = "build-arm-driver.py NativeRamBlock", when = "XNU_NATIVE_RAM_BLOCK" },
  { run = "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block", when = "XNU_NATIVE_RAM_BLOCK" },
  # owner keys, OS and SystemOS policies over the 20H392 images, libVerifiedRootProbe.a
  { run = "build-fajita-verified-root.py --ipsw-build 20H392 --image os:087-86698-044.dmg:DADD93F8-DBBF-4B17-A1DF-0F11E64172F7:6e87bfcaa8eca952e00b719f333d1f1060715a63566112267ad8730e1ed98906:1375753 --image systemos:087-86593-047.dmg:96096B28-B6DC-4BC7-9D3A-2632A0FE53F1:9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849:669696", when = "XNU_VERIFIED_ROOT_PROBE" },
  { run = "build-arm-driver.py NativeUfs", when = "XNU_NATIVE_UFS" },
  { run = "build-native-spmi.py", when = "XNU_BOOT_PROGRESS" },   # libNativeSpmi.a: SPMI PMIC arbiter v5 bus (drivers/NativeSpmi); idle until called
  { run = "build-fajita-dwc3.py", when = "XNU_BOOT_PROGRESS" },   # NativeDwc3 (personality: patches/xnu/zzv-native-dwc3-personality.patch via ios16/patches; default off, native-dwc3-probe=1); BootLog reads its state words
  { run = "build-sheng-platform-power.py", when = "XNU_SHENG_PMGR" },
  { run = "build-boot-progress.py", when = "XNU_BOOT_PROGRESS" },
  { run = "build-native-legacy-display.py", when = "XNU_NATIVE_LEGACY_DISPLAY" },   # CPU-rendered display, HID input, keystore stub
  { run = "build-fajita-touch.py", when = "XNU_NATIVE_LEGACY_DISPLAY" },            # libFajitaTouch.a (fajita-touch=<stage>), NOTES-touch.md
  { run = "build-fajita-cpufreq.py", when = "XNU_BOOT_PROGRESS" },                  # libFajitaCpuFreq.a (fajita-cpufreq=<n>)
  { run = "build-fajita-pmic.py", when = "XNU_BOOT_PROGRESS" },                     # libFajitaPmic.a (fajita-pmic=<stage>): charger, keys, battery
]

# The 20H392 kernelcache (xnu-8796.142.1.703.8). The roots are the iPad list; all of them are in this kernelcache.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
# The 20H392 AMFI, AppleImage4 and sandbox kexts are no longer started: the kernel carries the HackiOS AMFI and Sandbox
# MAC-policy stand-ins (patches/xnu-8796/zzw-hackios-security-standins.patch), which OSKext loads-but-does-not-start.
# sandbox is dropped from the roots below (nothing depends on it); AMFI and AppleImage4 are dropped too but the prelink
# dependency closure pulls them back in (IOHIDFamily/IOGPUFamily/IOMobileGraphicsFamily/apfs list them as libraries).
# No early_security_init: AMFI's early initializer must never run (the stand-in registers the amfi/img4 interfaces).
# boot-arg fajita-security-kexts=1 makes OSKext start the prelinked AMFI and AppleImage4 and keeps the stand-ins from
# registering; a full return to Apple's set also needs sandbox in the roots and the early_security_init line above restored.
# The 20H392 Libm keeps a 1228-byte constant pool in its code (0xfffffff005b8c054..0xfffffff005b8c520, between a ret and the
# next function, read by ldr and adr) where 21H461 has the 1248-byte one NativePrelink knows; some of its words decode as
# branches out of the collection.
extra_args = ["--inline-data", "0000807f0000004100008040db0f493f:1228:73df5b757c53532583e3686b7d93df11ec1f5dd8c201d05502654a7812cc385f"]
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The payload of the iOS 16 boot option: the iPad payload (../board.toml) with the iPhone X identity, the 20H392 trust caches,
# volumes and Data seed (ios16/data-seed.json), and the root image at 16 GiB into userdata. The boot image (UEFI and
# DarwinBoot) is the iPad board's; only the payload partition (system_a) differs.
[payload]
volume = "FAJITAESP"
size_mib = 192
loader = "firmware"
title = "fajita iOS 16.7.16 (iPhone X)"
dram_size = "0x200000000"
panic_screen = true
# The static and System trust caches of 20H392, bundled unchanged (static first).
trust_cache_sha256 = [
  "eb1475f643f45a974ebd40596f6e2b1cdf40205d2ca3c6094d774886099399c3",
]
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-timer-intid=19","-apfs_shared_datavolume","ml-timeout-lock-panic-scale=40","sheng-staged-apps=1","sheng-disable-watchdogd=1","sheng-lite=1","sheng-data-persist=2","boot-progress=2","sheng-log=1","pcpu=0xf0","fajita-wdog=3","wdog-irq=0","sheng-smp=1","cpus=8","armcpu-self-ipi=1","fajita-cpufreq=2","native-data-writeback=1",
  "-no_slto_panic",
  "native-ufs-root=1",
  "native-ufs-root-base=16384",       # the 20H392 root image starts 16 GiB into userdata, after the iPadOS one
  "offline-hid-input=1",
  "offline-hid-home=1",
  "offline-key-events=1",
  "sheng-aks=1",
  "sheng-gpu-addon=1",
]

# Board arguments beyond the 1020-byte command line: the ADT tool writes them to /chosen/board-args and the kernel's
# PE_parse_boot_argn reads one there when the command line lacks it (UniXNU patches/xnu-8796/board-args.patch); a --kernel-arg of
# the same name still replaces one. Only arguments read after the device tree is set up belong here: these are all read by
# drivers (NativeUfs, NativeLegacyDisplay, the fajita kit) or by bsd_init. The iPad board keeps all of them on its command line.
board_args = [
  "native-ufs-smmu-stream=0x100",
  "native-ufs-smmu-mask=0xf",
  "native-ufs-smmu-size=0x80000",
  "native-ufs-smmu-adopt=1",
  "offline-mobile-graphics-load=1",
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # The iPhone X screen, 1125x2436 at scale 3 (375x812 points), fitted onto the 1080x2340 panel (0.96, nearly edge to edge).
  "offline-legacy-unit-scale=3","fajita-display-logical=1125x2436","fajita-display-ppi=458","fajita-fb-wc=1","fajita-fb-src-cached=1","sheng-fb-diff=1",
  "sheng-vsync=60",
  "sheng-banner=0",
  # Touch edge zone of NativeHidInput (thousandths of the screen): HackiOS's iPhone X zone, 16/375 at the sides, 16/812 at the top,
  # 34/812 (the home bar strip) at the bottom. A contact that begins there is marked as coming in over the edge (0x800).
  "native-touch-edge-side=43","native-touch-edge-top=20","native-touch-edge-bottom=42",
  # PMI8998 charging (package/FajitaPmic.cpp): the pmOS qcom_smbx charger setup, fast charge 1.0 A, USB input limit 1.5 A, a status
  # row (charger, fuel-gauge voltage/current) every 30 s, no register dump. fajita-pmic=1 on the command line makes a run read only.
  "fajita-pmic=2","fajita-pmic-dump=0","fajita-pmic-period=30",
]

# Fixups of signed text (patches/xnu/native-text-fixup.patch, in the 8796 series too), as the iPad board's: <file name>,<file offset>,
# <original>,<replacement> in hex, located in 20H392 by the same symbols and instruction patterns and checked against its bytes
# (dyld_shared_cache_arm64.11 and .13 of the 20H392 SystemOS, BTAudioHALPlugin of its OS volume).
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] (20H392: the same adrp/ldr/b, a tail call of [AWClientPreferences
  # initializePreferences], an empty method that only forces +[AWClientPreferences initialize], which dispatch_syncs onto its
  # preferences queue from inside class initialization, the ABBA of the iPad's SpringBoard and Siri's SASMyriadController); it
  # returns at once instead.
  "dyld_shared_cache_arm64.13,1cd5a9c,684a19d0004d47f9,c0035fd6004d47f9",
  # PosterBoardServices: PRSPosterPathFileAttributes ({NSFilePosixPermissions, NSFileProtectionKey: NSFileProtectionNone}, the
  # attributes PosterBoard creates its store directories with) keeps only its first entry, as on the iPad. 20H392 has no
  # PRSPosterPathURLResourceValues and no data store viability check or migrator: its counterpart,
  # +[PBFPosterModelStoreCoordinator expectedURLResourceValuesForAllPaths], only feeds the best-effort
  # _accessQueue_fixupResourceValues pass (it sets values and logs failures), so nothing there keeps the store from being made.
  "dyld_shared_cache_arm64.11,10cbca8,44008052,24008052",
  # BTAudioHALPlugin's factory (AudioServerPlugIn_Create, 20H392 at 0x356f8 with the same prologue) returns NULL, so the audio server
  # (mediaserverd: iOS 16 has no audiomxd) skips it. bluetoothd is disabled here too (sheng-lite=1), and the plugin has the same
  # connection code to com.apple.BTAudioHALPlugin.xpc that looped on the iPad.
  "BTAudioHALPlugin,356f8,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-fajita-adt.py"
root_match_volume_uuid = "DADD93F8-DBBF-4B17-A1DF-0F11E64172F7"   # the 20H392 OS volume
owned_memory_size = "0x130000000"
packed_data_ramdisk = true
persistent_data = true
# --vmm-present: AMFI skips the PMGR (scripts/make-fajita-adt.py), so CONFIG_XNU_SHENG_PMGR is off for this board.
args = ["--identity", "iphone10,6", "--vmm-present", "--manifest-bnch", "--chosen-display-scale"]
chip_id = "207"
unique_chip_id = "required"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
