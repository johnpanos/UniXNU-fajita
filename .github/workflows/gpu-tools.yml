name: GPU userland tools

# Builds the fajita GPU userland test tools (package/gpu-tools) for plain arm64 iOS 16 on a macOS runner (the Linux host has no iOS SDK
# or Mach-O signer), 4 KiB-page ad-hoc signed with the usb-debug agent's minimal entitlements. ngpu-probe drives NativeAdreno's user-client
# ABI directly; its header comes from the johnpanos/NativeAdreno fork (branch fajita-a630). The kernel embeds the signed binaries and
# writes them under /private/var/ngpu/sbin (usb-debug=3 mounts that over /usr/sbin), so the usb-debug agent can run them.
on:
  workflow_dispatch:
  push:
    paths:
      - package/gpu-tools/**
      - .github/workflows/gpu-tools.yml

permissions:
  contents: read

jobs:
  tools:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: johnpanos/NativeAdreno
          ref: fajita-a630
          path: NativeAdreno
      - uses: actions/checkout@v4
        with:
          repository: johnpanos/NativeMetal
          ref: fajita-a630
          path: NativeMetal
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.4.309
          path: Vulkan-Headers
      - name: Smoke shaders
        run: |
          set -e
          brew install shaderc spirv-tools || true
          mkdir -p smoke
          python3 - <<'PY'
          from pathlib import Path
          import struct, subprocess, tempfile
          lines = ['#pragma once', '#include <stdint.h>']
          with tempfile.TemporaryDirectory() as tmp:
              for source in sorted(Path('NativeMetal/shaders').glob('smoke_*')):
                  spv = Path(tmp) / (source.name + '.spv')
                  subprocess.run(['glslc', '--target-env=vulkan1.1', '-O', str(source), '-o', str(spv)], check=True)
                  words = struct.unpack('<%dI' % (spv.stat().st_size // 4), spv.read_bytes())
                  lines.append('static const uint32_t kSpv_%s[] = {' % source.name.replace('.', '_'))
                  lines += ['    ' + ', '.join('0x%08x' % w for w in words[i:i + 8]) + ',' for i in range(0, len(words), 8)]
                  lines.append('};')
          Path('smoke/NativeTurnipShaders.h').write_text('\n'.join(lines) + '\n')
          PY
      - name: Build and sign
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun --sdk iphoneos clang++ -std=c++17 -target arm64-apple-ios16.0 -isysroot "$SDK" -O2 -Wall -Wextra -Werror \
            -I package/gpu-tools/include -I NativeAdreno package/gpu-tools/ngpu-probe.cpp -framework IOKit -o out/ngpu-probe
          codesign --force --sign - --pagesize 4096 --identifier org.blu-sharky.ngpu-probe \
            --entitlements package/gpu-tools/ngpu-probe-entitlements.plist out/ngpu-probe
          codesign --verify --strict out/ngpu-probe
          codesign -dvvv out/ngpu-probe 2>&1 | grep -E 'CDHash|Page size|Identifier' | tee out/codesign.txt
          xcrun --sdk iphoneos clang++ -std=c++17 -fobjc-arc -target arm64-apple-ios16.0 -isysroot "$SDK" -O2 -Wall -Wextra -Werror \
            -x objective-c++ package/gpu-tools/ngpu-metal.mm -framework Foundation -framework Metal -o out/ngpu-metal
          codesign --force --sign - --pagesize 4096 --identifier org.blu-sharky.ngpu-metal \
            --entitlements package/gpu-tools/ngpu-probe-entitlements.plist out/ngpu-metal
          codesign --verify --strict out/ngpu-metal
          xcrun --sdk iphoneos clang++ -std=c++17 -target arm64-apple-ios16.0 -isysroot "$SDK" -O2 -Wall -Wextra -Wno-unused-parameter \
            -Wno-missing-field-initializers -I NativeMetal -I Vulkan-Headers/include -I smoke package/gpu-tools/ngpu-vk.cpp -o out/ngpu-vk
          codesign --force --sign - --pagesize 4096 --identifier org.blu-sharky.ngpu-vk \
            --entitlements package/gpu-tools/ngpu-probe-entitlements.plist out/ngpu-vk
          git -C NativeAdreno rev-parse HEAD > out/native-adreno.txt
          file out/ngpu-probe
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-tools
          path: out/
