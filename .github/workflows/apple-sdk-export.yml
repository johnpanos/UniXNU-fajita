name: Apple SDK export (encrypted)

# Exports the exact iPhoneOS SDK (and the clang runtime archives) the GPU plugin CI builds against, for the pinned-toolchain build on Linux
# (scripts/build-gpu-plugin-local.sh). The repositories are public, so the tarball is AES-256 encrypted with the repo secret SDK_TAR_KEY
# and kept for one day; the local side downloads, decrypts into the gitignored .cache/apple-sdk and deletes the artifact. Never commit it.
on:
  workflow_dispatch:
  push:
    branches: [gpu-local-build]
    paths: [.github/workflows/apple-sdk-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Export
        env:
          SDK_TAR_KEY: ${{ secrets.SDK_TAR_KEY }}
        run: |
          set -e
          [ -n "$SDK_TAR_KEY" ] || { echo no key; exit 1; }
          SDK=$(cd "$(xcrun --sdk iphoneos --show-sdk-path)" && pwd -P)
          TC=$(dirname "$(dirname "$(xcrun --find clang)")")
          mkdir -p stage/toolchain
          ( xcode-select -p; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun --sdk iphoneos --show-sdk-build-version
            xcrun clang --version; xcrun ld -v 2>&1; xcrun -sdk iphoneos metal --version 2>&1 || true ) > stage/versions.txt
          cat stage/versions.txt
          ditto "$SDK" "stage/$(basename "$SDK")"
          RT=$(dirname "$(ls "$TC"/lib/clang/*/lib/darwin/libclang_rt.ios.a | head -1)")
          mkdir -p stage/toolchain/clang-rt && cp "$RT"/libclang_rt.ios.a stage/toolchain/clang-rt/
          du -sh stage/*
          tar -C stage -czf sdk.tgz .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SDK_TAR_KEY -in sdk.tgz -out sdk.tgz.enc
          rm sdk.tgz
          shasum -a 256 sdk.tgz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: apple-sdk-enc
          path: sdk.tgz.enc
          retention-days: 1
          compression-level: 0
